# GoReleaser builds the cross-platform binaries, the OS packages (deb, rpm, apk,
# Arch) and an SBOM per archive, and keyless-signs the checksums file with
# cosign using the GitHub Actions OIDC token — no long-lived keys.
#
# The release is created as a DRAFT: immutable releases reject asset uploads
# once a release is published, so every asset must land while it is still a
# draft. The workflow publishes it last. See .github/workflows/release.yml.
version: 2

project_name: sci-disclose

before:
  hooks:
    - go mod tidy

builds:
  - id: sci
    main: ./cmd/sci
    binary: sci
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: sci-disclose
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - src: man/*.1
        dst: man

# The OS packages. One binary, one man page, the licence and the readme — laid
# out where a packager expects them rather than in a tarball to unpack.
nfpms:
  - id: sci-disclose
    package_name: sci-disclose
    vendor: Fabio Cicerchia
    homepage: https://github.com/fabiocicerchia/sci-disclose
    maintainer: Fabio Cicerchia <info@fabiocicerchia.it>
    description: Software Carbon Intensity (SCI) from the command line
    license: Apache-2.0
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    section: utils
    contents:
      - src: man/sci.1
        dst: /usr/share/man/man1/sci.1
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/sci-disclose/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/sci-disclose/README.md
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

# One SBOM (SPDX JSON) per release archive.
sboms:
  - artifacts: archive

# Keyless cosign signature over checksums.txt — verifying the checksum then
# verifies every artifact it lists.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# The Homebrew cask, published to fabiocicerchia/homebrew-tap on release:
#
#   brew install fabiocicerchia/tap/sci-disclose
#
# A cask, not a formula: homebrew-core requires formulae to build from source,
# and these are prebuilt binaries. Casks are macOS-only — Linux users install
# the deb/rpm/apk above.
homebrew_casks:
  - name: sci-disclose
    binaries: [sci]
    manpages: [man/sci.1]
    homepage: https://github.com/fabiocicerchia/sci-disclose
    description: Software Carbon Intensity (SCI) from the command line
    repository:
      owner: fabiocicerchia
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Build the cask always, push it only when the tap token is present, so a
    # release does not fail on a secret that has not been added yet.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    # This binary is not notarized, so Gatekeeper quarantines it on download.
    # GoReleaser documents stripping the quarantine flag in a post-install hook;
    # that is a deliberate bypass of a macOS security control, so it is not done
    # here — the user is told instead. Notarizing (an Apple Developer account)
    # is the fix that removes this note.
    caveats: |
      macOS quarantines binaries it cannot verify. On first run:
        xattr -d com.apple.quarantine "$(brew --prefix)/bin/sci"

release:
  github:
    owner: fabiocicerchia
    name: sci-disclose
  # Created unpublished so the workflow can attach assets to it; the workflow
  # flips it to published as its last step.
  draft: true
  prerelease: auto
  footer: |
    ## Verify the download

    ```sh
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/fabiocicerchia/sci-disclose' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    ```
