version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

    # House set (TOOLING.md). The rules above are kept as they were.
    - contextcheck      # FC-GO-009
    - godox             # FC-GEN-010 - no TODO/FIXME/HACK markers
    - forbidigo         # FC-GEN-055 - blocks time.Now, os.Getenv outside the root
    - noctx             # FC-GEN-032
    - nilerr
    - errname
    - exhaustive
    - gocritic
    - lll               # FC-GEN-045 - 120 columns. gofmt does not wrap, so
                        # nothing else here holds the line.
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    lll:
      line-length: 120
    errcheck:
      check-type-assertions: true
      check-blank: true         # FC-GO-007 - a discarded error must be explicit
    exhaustive:
      default-signifies-exhaustive: true
    godox:
      keywords: [TODO, FIXME, HACK, XXX]
    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: "FC-GEN-055: inject a clock."
        - pattern: ^os\.Getenv$
          msg: "FC-GEN-055: read env once at startup into validated config."
    revive:
      rules:
        - name: exported        # FC-GEN-008
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: package-comments

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, forbidigo]   # tests may freeze the clock directly
      - path: (^|/)(main|cmd)/
        linters: [forbidigo]                    # composition root reads env and the clock
      # A JSON fixture inside a raw string literal: the long line is one value of
      # the document under test, and breaking it would change the fixture rather
      # than reflow it.
      - path: internal/testutil/fixtures\.go
        linters: [lll]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fabiocicerchia/sci-disclose

issues:
  # Report every finding. The defaults stop at three issues per message and
  # fifty per linter, which turns a backlog into a number that stops moving
  # while the work is still there.
  max-issues-per-linter: 0
  max-same-issues: 0
