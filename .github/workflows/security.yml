name: security

on:
  # No push trigger: the pull request already ran this on the identical
  # tree. What a merge cannot tell you, the schedule below can.
  pull_request:
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  pull-requests: read # gitleaks reads PR commits
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            ./

      # setup-trivy's install script downloads from get.trivy.dev, which no longer
      # resolves; the GitHub release is the same binary, checked against its sum.
      - name: install trivy
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          tgz="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: trivy filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Fails the job rather than uploading SARIF: the Security tab needs
          # GitHub Advanced Security, which the private repos in the fleet
          # don't have.
          exit-code: "1"

      # License compliance. .fossa.yml has been sitting in every repo unused —
      # this is the step that actually runs it. The secret check lives in the
      # script rather than in `if:` so a repo with no FOSSA project skips the
      # scan and still goes green.
      - name: fossa license scan
        if: hashFiles('.fossa.yml') != ''
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FOSSA_API_KEY:-}" ]; then
            echo "::notice::FOSSA_API_KEY not configured — skipping license scan."
            exit 0
          fi
          # Pinned to a commit so the script is a fixed, reviewable artifact.
          # Downloaded first so a truncated fetch fails here instead of half-running.
          curl -fsSL -o "$RUNNER_TEMP/fossa-install.sh" https://raw.githubusercontent.com/fossas/fossa-cli/10e2abc671d51ed671486da984d0fe601fa434d3/install-latest.sh
          bash "$RUNNER_TEMP/fossa-install.sh"
          fossa analyze
          # Fails the job on a policy violation: copyleft in a permissive repo,
          # or a dependency with no resolvable license.
          fossa test --timeout 600
