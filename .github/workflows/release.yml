name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR tags the
# release (vX.Y.Z) and publishes a GitHub Release. Nothing else to run.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # Manifest mode: release-please-config.json lists every file carrying
          # the version, so one merge moves version.txt, the CHANGELOG and the
          # in-code constants together. `release-type: simple` would bump
          # version.txt alone and let the rest drift.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
