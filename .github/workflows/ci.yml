name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A github-actions bump touches workflow files only, never the code under test.
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # -race and -count=1 are not optional: the race detector is what lets the
      # README claim "0 race conditions detected", and -count=1 defeats the
      # test cache so a green run means the tests actually executed.
      - name: Test
        run: go test -race -count=1 ./...

      # FC-GO-002 wants golangci-lint v2 blocking in CI. The config was already
      # in the repository but no step ever ran it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          # Pinned per FC-GEN-059; matches the v2 config schema.
          version: v2.13.2

  action:
    # Dependabot's token is read-only, so the ledger push cannot work there.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # a throwaway ledger branch, deleted at the end
    env:
      LEDGER: ci-ledger-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: first
        uses: ./
        with:
          manifest: examples/sci.yaml
          args: --offline
          window-budget: "1e12"
          ledger-branch: ${{ env.LEDGER }}

      - id: limit
        env:
          SPENT: ${{ steps.first.outputs.total-gco2e }}
        run: echo "limit=$(jq -n "$SPENT * 1.5")" >>"$GITHUB_OUTPUT"

      - id: second
        continue-on-error: true
        uses: ./
        with:
          manifest: examples/sci.yaml
          args: --offline
          window-budget: ${{ steps.limit.outputs.limit }}
          ledger-branch: ${{ env.LEDGER }}

      - id: over
        continue-on-error: true
        uses: ./
        with:
          manifest: examples/sci.yaml
          args: --offline
          budget: "0.000001"

      - name: Check the gates
        env:
          SECOND: ${{ steps.second.outcome }}/${{ steps.second.outputs.within-window-budget }}
          OVER: ${{ steps.over.outcome }}/${{ steps.over.outputs.within-budget }}/${{ steps.over.outputs.sci }}
        run: |
          set -x
          [ "$SECOND" = failure/false ]
          [[ "$OVER" == failure/false/?* ]]
          git fetch -q origin "$LEDGER"
          [ "$(git show FETCH_HEAD:ledger.jsonl | wc -l)" -eq 1 ]

      - if: always()
        run: git push -q origin --delete "$LEDGER" || true
