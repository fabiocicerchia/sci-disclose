name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # -race and -count=1 are not optional: the race detector is what lets the
      # README claim "0 race conditions detected", and -count=1 defeats the
      # test cache so a green run means the tests actually executed.
      - name: Test
        run: go test -race -count=1 ./...

      # FC-GO-002 wants golangci-lint v2 blocking in CI. The config was already
      # in the repository but no step ever ran it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          # Pinned per FC-GEN-059; matches the v2 config schema.
          version: v2.13.2
          # The house set reports 41 pre-existing findings here. Gating only
          # changed lines adopts the rules now and leaves the backlog visible.
          only-new-issues: true
